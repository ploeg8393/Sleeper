<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sleeper League Vault — Loading League...</title>
  <script>
    (function () {
      var path = window.location.pathname || "/";
      var match = path.match(/^(.*?)\/((?:(?:espn|sleeper)[:_-])?\d{3,25})\/?$/i);
      if (match) {
        var base = match[1] + "/";
        var token = match[2];
        window.location.replace(base + "?" + token + (window.location.hash || ""));
      } else {
        var fallbackBase = path.replace(/[^\/]*$/, "");
        window.location.replace(fallbackBase || "/");
      }
    })();
  </script>
</head>
<body style="background:#161a1f; color:#e6ebf0; font-family:sans-serif; padding:24px;">
  Loading Fantasy League...
</body>
</html>
